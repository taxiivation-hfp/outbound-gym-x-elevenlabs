<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Retention Router architecture</title>
  <desc>An offline Python pipeline produces raw member facts. At call time TypeScript decides who is called, the variable compiler builds the payload, and one of three ElevenLabs agents makes the call over Twilio. The post-call webhook writes the analysis back to Supabase, which feeds both the dashboard and the next call.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71717a"/>
    </marker>
    <marker id="arrowLime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6ff3d"/>
    </marker>
  </defs>

  <rect width="1160" height="700" fill="#09090b"/>

  <text x="32" y="42" fill="#fafafa" font-size="20" font-weight="800" letter-spacing="0.5">RETENTION ROUTER</text>
  <text x="32" y="64" fill="#71717a" font-size="13">One member, from a row in a gym export to a phone call and back again.</text>

  <text x="32" y="108" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1.4">OFFLINE, PYTHON</text>
  <rect x="32" y="120" width="232" height="72" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="48" y="146" fill="#fafafa" font-size="13" font-weight="700">generate_gym_data.py</text>
  <text x="48" y="166" fill="#a1a1aa" font-size="11">members, contracts, check-ins</text>
  <text x="48" y="182" fill="#71717a" font-size="11">500 synthetic members, seed 42</text>

  <rect x="32" y="212" width="232" height="88" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="48" y="238" fill="#fafafa" font-size="13" font-weight="700">build_scores.py</text>
  <text x="48" y="258" fill="#a1a1aa" font-size="11">features, then five cohorts by</text>
  <text x="48" y="274" fill="#a1a1aa" font-size="11">readable rules, no model</text>
  <text x="48" y="292" fill="#71717a" font-size="11">emits raw facts only</text>

  <rect x="32" y="320" width="232" height="58" rx="10" fill="#0c0a09" stroke="#52525b" stroke-dasharray="4 3"/>
  <text x="48" y="344" fill="#fafafa" font-size="12" font-weight="700">data/members_scored.json</text>
  <text x="48" y="364" fill="#71717a" font-size="11">+ dataset_meta.json, frozen date</text>

  <rect x="32" y="398" width="232" height="58" rx="10" fill="#0c0a09" stroke="#52525b" stroke-dasharray="4 3"/>
  <text x="48" y="422" fill="#fafafa" font-size="12" font-weight="700">data/gyms.json</text>
  <text x="48" y="442" fill="#71717a" font-size="11">two gyms, hours, incentives</text>

  <text x="324" y="108" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1.4">DECIDE, TYPESCRIPT, AT CALL TIME</text>
  <rect x="324" y="120" width="252" height="116" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="340" y="146" fill="#fafafa" font-size="13" font-weight="700">lib/callType.ts</text>
  <text x="340" y="166" fill="#d6ff3d" font-size="11" font-weight="700">auto_renew, and nobody is called</text>
  <text x="340" y="186" fill="#a1a1aa" font-size="11">renewal, 14 days before expiry</text>
  <text x="340" y="202" fill="#a1a1aa" font-size="11">reengagement, 28 days absent</text>
  <text x="340" y="218" fill="#a1a1aa" font-size="11">winback, 1, 3 and 6 months after</text>

  <rect x="324" y="256" width="252" height="104" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="340" y="282" fill="#fafafa" font-size="13" font-weight="700">lib/eligibility.ts</text>
  <text x="340" y="302" fill="#a1a1aa" font-size="11">do-not-contact, permanent</text>
  <text x="340" y="318" fill="#a1a1aa" font-size="11">attempt cap, three conversations</text>
  <text x="340" y="334" fill="#a1a1aa" font-size="11">cooldown, three months, unless</text>
  <text x="340" y="350" fill="#a1a1aa" font-size="11">the last call worked</text>

  <rect x="324" y="380" width="252" height="112" rx="10" fill="#18181b" stroke="#d6ff3d" stroke-opacity="0.45"/>
  <text x="340" y="406" fill="#fafafa" font-size="13" font-weight="700">lib/compileVariables.ts</text>
  <text x="340" y="426" fill="#71717a" font-size="11">the only place app names become</text>
  <text x="340" y="442" fill="#71717a" font-size="11">prompt names</text>
  <text x="340" y="462" fill="#a1a1aa" font-size="11">context, expiry_line, time_left,</text>
  <text x="340" y="478" fill="#a1a1aa" font-size="11">incentives: 16 variables, all set</text>

  <text x="636" y="108" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1.4">CALL, ELEVENLABS</text>
  <rect x="636" y="120" width="228" height="50" rx="10" fill="#18181b" stroke="#d6ff3d" stroke-opacity="0.45"/>
  <text x="652" y="142" fill="#d6ff3d" font-size="12" font-weight="700">charlie-renewal</text>
  <text x="652" y="160" fill="#71717a" font-size="11">still training, term lapsing</text>

  <rect x="636" y="182" width="228" height="50" rx="10" fill="#18181b" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="652" y="204" fill="#67e8f9" font-size="12" font-weight="700">charlie-reengagement</text>
  <text x="652" y="222" fill="#71717a" font-size="11">live membership, stopped coming</text>

  <rect x="636" y="244" width="228" height="50" rx="10" fill="#18181b" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="652" y="266" fill="#c4b5fd" font-size="12" font-weight="700">charlie-winback</text>
  <text x="652" y="284" fill="#71717a" font-size="11">already lapsed</text>

  <rect x="636" y="312" width="228" height="76" rx="10" fill="#0c0a09" stroke="#3f3f46"/>
  <text x="652" y="336" fill="#a1a1aa" font-size="11">Four sections byte-identical:</text>
  <text x="652" y="354" fill="#fafafa" font-size="11" font-weight="700">Personality, Tone, Guardrails, Tools</text>
  <text x="652" y="374" fill="#71717a" font-size="11">stored once, assembled at sync</text>

  <rect x="636" y="408" width="228" height="84" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="652" y="432" fill="#fafafa" font-size="12" font-weight="700">Twilio</text>
  <text x="652" y="452" fill="#a1a1aa" font-size="11">mu-law 8000, voice out</text>
  <text x="652" y="470" fill="#a1a1aa" font-size="11">SMS via /api/send-text</text>
  <text x="652" y="486" fill="#71717a" font-size="11">the agent never sees a URL</text>

  <text x="924" y="108" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1.4">MEMBER</text>
  <rect x="924" y="120" width="204" height="68" rx="34" fill="#d6ff3d"/>
  <text x="1026" y="150" fill="#000000" font-size="15" font-weight="800" text-anchor="middle">A phone rings</text>
  <text x="1026" y="170" fill="#1c1917" font-size="11" text-anchor="middle">under three minutes, one ask</text>

  <text x="924" y="232" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1.4">BACK</text>
  <rect x="924" y="244" width="204" height="116" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="940" y="270" fill="#fafafa" font-size="12" font-weight="700">/api/webhook</text>
  <text x="940" y="290" fill="#a1a1aa" font-size="11">11 extracted fields, typed</text>
  <text x="940" y="306" fill="#a1a1aa" font-size="11">3 criteria results</text>
  <text x="940" y="322" fill="#a1a1aa" font-size="11">raw analysis, kept whole</text>
  <text x="940" y="342" fill="#71717a" font-size="11">HMAC verified, forgeries 401</text>

  <rect x="924" y="380" width="204" height="72" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="940" y="406" fill="#fafafa" font-size="12" font-weight="700">Supabase, call_records</text>
  <text x="940" y="426" fill="#a1a1aa" font-size="11">one row per dial</text>
  <text x="940" y="442" fill="#71717a" font-size="11">the memory the next call reads</text>

  <rect x="324" y="540" width="252" height="92" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="340" y="566" fill="#fafafa" font-size="13" font-weight="700">evals/</text>
  <text x="340" y="586" fill="#a1a1aa" font-size="11">19 routing guards, no model</text>
  <text x="340" y="602" fill="#a1a1aa" font-size="11">15 simulated calls, real agents</text>
  <text x="340" y="622" fill="#71717a" font-size="11">same compiler as the live call</text>

  <rect x="636" y="540" width="492" height="92" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="652" y="566" fill="#fafafa" font-size="13" font-weight="700">Dashboard, Next.js on Vercel</text>
  <text x="652" y="586" fill="#a1a1aa" font-size="11">three call-type columns, and the excluded buckets with their reasons</text>
  <text x="652" y="602" fill="#a1a1aa" font-size="11">why they leave, who is expected at the desk, cost and break-even</text>
  <text x="652" y="622" fill="#71717a" font-size="11">server components share lib/ with the API, so the screen cannot disagree with it</text>

  <path d="M 148 192 L 148 212" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 148 300 L 148 320" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 264 348 L 320 300" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 264 426 L 320 440" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 450 236 L 450 256" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 450 360 L 450 380" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 576 420 C 606 420, 606 152, 632 146" stroke="#71717a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 576 432 C 606 432, 606 212, 632 207" stroke="#71717a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 576 444 C 606 444, 606 272, 632 269" stroke="#71717a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 864 145 C 894 145, 894 410, 868 440" stroke="#3f3f46" stroke-width="1.5" fill="none"/>
  <path d="M 868 434 L 920 176" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1026 188 L 1026 244" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1026 360 L 1026 380" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 920 416 L 600 416" stroke="#d6ff3d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowLime)"/>
  <text x="612" y="408" fill="#d6ff3d" font-size="11" font-weight="700">the closed loop: which conversation this is, and what they already told us</text>
  <path d="M 1026 452 L 1026 540" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 450 492 L 450 540" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 576 586 L 632 586" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
